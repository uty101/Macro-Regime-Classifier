name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: pytest on Python 3.11
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package and its pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the test suite
        # No FRED_API_KEY is set on purpose: the committed raw snapshots in
        # data/raw/ must be enough to run every test offline (convention 17).
        run: pytest -q
